name: Images R2 backup

# Copies every photo in images/ to the R2 bucket muslimabaya-product-images under the same key, so a copy
# of each photo is also at https://images.muslimabaya.com/images/<path>. Backup only: nothing is overwritten
# or deleted, and the site keeps serving /images/ from Cloudflare Pages.
# Needs the repository secret CLOUDFLARE_API_TOKEN to include "Account → Workers R2 Storage → Edit".

on:
  push:
    branches: [main, backup/images-r2]
    paths:
      - "images/**"
      - "scripts/sync-images-to-r2.mjs"
      - ".github/workflows/images-r2-backup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-r2-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check credentials secret
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; skipping the R2 image backup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Copy missing photos to R2 and verify
        if: steps.creds.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-images-to-r2.mjs
