name: Sale Schedule Rebuild

# Product Manager → Schedule: sale prices start at 00:00 and end after 23:59 (Bangladesh time);
# Publish box: a product scheduled for a date and time goes live then.
# Prices on the website, in the cart and on the order server switch by themselves at that moment.
# The pre-rendered product pages and Google product data are built files, so on a day a sale starts
# or ends this job asks Cloudflare Pages to rebuild the site from the latest commit (no new commit).
# Uses the existing CLOUDFLARE_API_TOKEN secret (needs Cloudflare Pages → Edit). Free GitHub Actions.

on:
  schedule:
    - cron: "3 * * * *"   # every hour at :03 (sales: the 00:03 Bangladesh-time run; scheduled publish: that hour)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if no sale starts or ends today"
        type: boolean
        default: false

permissions:
  contents: read

env:
  ACCOUNT_ID: b24e0c217c57ed7b4e19e104a1411309
  PROJECT: luxury-dress-bd

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Any sale starting or ending today?
        id: check
        run: node scripts/sale-boundary-check.mjs
      - name: Rebuild Cloudflare Pages (production)
        if: steps.check.outputs.rebuild == 'true' || inputs.force
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "branch=main" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/deployments")
          node -e "const r=require('./out.json');console.log('HTTP $code success='+r.success, r.result&&r.result.id||'', JSON.stringify(r.errors||[]))"
          [ "$code" = "200" ] || exit 1
