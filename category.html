  <script>
    (function() {
      function forceStart() {
        var key = window.__maDynamicCategoryKey;
        if (key) {
          var section = (window.CATALOG_SECTIONS || []).find(function (item) { return item.key === key; });
          if (section) {
            document.title = (section.menuBn || section.menu || key) + " Collection | Muslim Abaya";
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.href = window.location.origin + window.location.pathname + window.location.search;
          }
          if (typeof window.bootShopCategory === "function") window.bootShopCategory(key);
          return;
        }
        if (typeof window.bootAllCategories === "function") {
          window.bootAllCategories();
        } else if (typeof window.renderAllCategories === "function") {
          window.renderAllCategories();
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", forceStart);
      } else {
        forceStart();
      }

      // ব্যাকআপ টাইমার
      setTimeout(forceStart, 600);
    })();
