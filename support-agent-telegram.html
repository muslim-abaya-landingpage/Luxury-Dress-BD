<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Support Inbox · Muslim Abaya</title>
  <style>
    :root{font-family:Inter,system-ui,Arial,sans-serif;color:#202124;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh}.bar{height:60px;background:#111820;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.bar strong{letter-spacing:.04em}.bar-actions{display:flex;gap:8px}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.login{max-width:420px;margin:8vh auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 32px #0001}.login h1{margin-top:0;font-size:22px}.login input,.composer input{width:100%;padding:12px;border:1px solid #d3d7dd;border-radius:8px;margin:7px 0;font:inherit}.btn{background:#176b4a;color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:650;cursor:pointer}.btn.secondary{background:#374151}.err{color:#a32121;min-height:22px}.grid{display:none;grid-template-columns:340px minmax(0,1fr);gap:16px;height:calc(100vh - 112px)}.list,.thread{background:#fff;border-radius:14px;box-shadow:0 4px 18px #0000000b;min-height:0;overflow:hidden}.list h2,.thread-head{margin:0;padding:16px;border-bottom:1px solid #eceef1;font-size:16px}.items{overflow:auto;height:calc(100% - 54px)}.item{padding:14px 16px;border-bottom:1px solid #f0f1f3;cursor:pointer}.item:hover,.item.selected{background:#f4f7f5}.item strong{display:flex;justify-content:space-between;gap:8px}.item small{display:block;color:#68707a;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:11px;color:#176b4a;background:#e7f4ec;border-radius:99px;padding:3px 7px}.thread{display:flex;flex-direction:column}.thread-head small{display:block;color:#69717a;margin-top:4px}.messages{flex:1;overflow:auto;padding:18px;background:#fafafa}.msg{max-width:80%;padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}.msg.customer{background:#fff;border:1px solid #e5e7eb}.msg.agent{background:#e7f4ec;margin-left:auto}.msg time{display:block;font-size:10px;color:#707780;margin-top:5px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.composer input{margin:0}.empty{color:#6b7280;margin:auto;text-align:center;padding:24px}.hidden{display:none!important}@media(max-width:760px){.wrap{margin:12px auto}.grid{grid-template-columns:1fr;height:calc(100dvh - 86px)}.list{max-height:34vh}.thread{min-height:55vh}.msg{max-width:92%}}
  </style>
</head>
<body>
  <header class="bar"><strong>MUSLIM ABAYA · SUPPORT</strong><div class="bar-actions"><button id="configure" class="btn secondary hidden">Configure Telegram webhook</button><button id="logout" class="btn secondary hidden">Sign out</button></div></header>
  <main class="wrap">
    <section id="login" class="login"><h1>Agent sign in</h1><p>Use an active account on the support-agent allow-list.</p>
      <form id="login-form"><input id="email" type="email" autocomplete="username" placeholder="Work email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn">Sign in</button></form>
      <div id="login-error" class="err" role="alert"></div>
      <p style="font-size:12px;color:#667085">Need access? Ask the project owner to add your verified email to <code>support_agents</code>.</p>
    </section>
    <section id="grid" class="grid">
      <aside class="list"><h2>Conversations <button id="refresh" class="btn secondary" style="float:right;padding:5px 9px">Refresh</button></h2><div id="items" class="items"></div></aside>
      <section class="thread"><header id="thread-head" class="thread-head">Select a conversation</header><div id="messages" class="messages"><div class="empty">Choose a conversation from the inbox.</div></div><form id="composer" class="composer hidden"><input id="reply" maxlength="2000" placeholder="Reply to customer…" required><button class="btn">Send</button></form></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (()=>{
    const PROJECT_URL='https://aajeqlgwlracqnfycdnb.supabase.co';
    const PUBLISHABLE_KEY='sb_publishable_U0lwxeyIQnccV8kMWUResw_drNDxbfM';
    const FUNCTION_URL=PROJECT_URL+'/functions/v1/telegram-support';
    const SETUP_URL=PROJECT_URL+'/functions/v1/telegram-webhook-setup';
    const sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
    const $=id=>document.getElementById(id);
    let selected=null,timer=null;
    async function api(path,options={}){
      const {data:{session}}=await sb.auth.getSession();
      if(!session)throw new Error('Please sign in again.');
      const response=await fetch(FUNCTION_URL+path,{...options,headers:{'content-type':'application/json','apikey':PUBLISHABLE_KEY,'authorization':'Bearer '+session.access_token,...(options.headers||{})}});
      const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data;
    }
    function time(s){try{return new Date(s).toLocaleString()}catch{return ''}}
    async function loadList(){
      try{
        const {conversations}=await api('/admin/conversations');const box=$('items');box.replaceChildren();
        for(const c of conversations){
          const latest=(c.support_messages||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
          const row=document.createElement('div');row.className='item'+(selected===c.id?' selected':'');
          const title=document.createElement('strong');title.textContent=(c.channel==='telegram'?'Telegram':'Website')+' · '+c.id.slice(0,8);
          const pill=document.createElement('span');pill.className='pill';pill.textContent=c.status;title.appendChild(pill);
          const preview=document.createElement('small');preview.textContent=latest?.body||'No messages';
          row.append(title,preview);row.onclick=()=>openConversation(c);box.appendChild(row);
        }
        if(!conversations.length){const e=document.createElement('div');e.className='empty';e.textContent='No support conversations yet.';box.appendChild(e)}
        if(selected&&conversations.some(c=>c.id===selected))await loadMessages(selected);
      }catch(e){$('login-error').textContent=e.message;}
    }
    async function openConversation(c){
      selected=c.id;$('thread-head').replaceChildren();const t=document.createElement('strong');t.textContent=(c.channel==='telegram'?'Telegram':'Website')+' conversation';const sub=document.createElement('small');sub.textContent=c.channel==='telegram'?'Replies are delivered to the Telegram bot chat.':'Website customer conversation';$('thread-head').append(t,sub);$('composer').classList.remove('hidden');await loadList();
    }
    async function loadMessages(id){
      const {messages}=await api('/admin/messages?conversation_id='+encodeURIComponent(id));const box=$('messages');box.replaceChildren();
      for(const m of messages){const d=document.createElement('div');d.className='msg '+(m.sender_role==='agent'?'agent':'customer');d.textContent=m.body;const t=document.createElement('time');t.textContent=time(m.created_at);d.appendChild(t);box.appendChild(d)}box.scrollTop=box.scrollHeight;
    }
    async function showInbox(){ $('login').classList.add('hidden');$('grid').style.display='grid';$('logout').classList.remove('hidden');$('configure').classList.remove('hidden');await loadList();if(timer)clearInterval(timer);timer=setInterval(loadList,10000); }
    $('login-form').onsubmit=async e=>{e.preventDefault();$('login-error').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error){$('login-error').textContent=error.message;return}try{await api('/admin/conversations');await showInbox()}catch(err){await sb.auth.signOut();$('login-error').textContent='This account is not active on the support-agent allow-list.'}};
    $('refresh').onclick=loadList;
    $('configure').onclick=async()=>{const button=$('configure');button.disabled=true;button.textContent='Configuring…';try{const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Please sign in again.');const response=await fetch(SETUP_URL,{method:'POST',headers:{'apikey':PUBLISHABLE_KEY,'authorization':'Bearer '+session.access_token,'content-type':'application/json'}});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.detail||result.error||'Webhook setup failed');alert(result.webhookMatches?'Telegram webhook set and verified.':'Webhook request completed, but URL verification failed.');}catch(error){alert(error.message||'Webhook setup failed.')}finally{button.disabled=false;button.textContent='Configure Telegram webhook'}};
    $('composer').onsubmit=async e=>{e.preventDefault();if(!selected)return;const input=$('reply'),message=input.value.trim();if(!message)return;try{await api('/admin/reply',{method:'POST',body:JSON.stringify({conversation_id:selected,message})});input.value='';await loadMessages(selected)}catch(err){alert(err.message)}};
    $('logout').onclick=async()=>{if(timer)clearInterval(timer);await sb.auth.signOut();location.reload()};
    sb.auth.getSession().then(async({data:{session}})=>{if(session){try{await api('/admin/conversations');await showInbox()}catch{await sb.auth.signOut()}}});
  })();
  </script>
</body>
</html>
