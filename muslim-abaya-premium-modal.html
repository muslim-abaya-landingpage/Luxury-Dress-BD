<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muslim Abaya — Remove Item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0e0e;
    --paper:#ffffff;
    --muted:#767676;
    --line:#e8e6e2;
    --sand:#f7f6f3;
    --gold:#a8875c;
    --gold-soft:#f3ece2;
    --radius:2px;
  }

  *{box-sizing:border-box;}

  body{
    font-family:'Inter', -apple-system, "Segoe UI", sans-serif;
    background:var(--sand);
    min-height:100vh;
    margin:0;
    color:var(--ink);
    padding:48px 20px;
  }

  /* ================= DEMO CART (Muslim Abaya) ================= */
  .brand-bar{
    max-width:480px;
    margin:0 auto 32px;
    text-align:center;
  }
  .brand-bar .logo{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .brand-bar .sub{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:4px;
  }

  .cart-row{
    max-width:480px;
    margin:0 auto 16px;
    background:#fff;
    border:1px solid var(--line);
    padding:20px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .cart-row .info strong{
    display:block;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:16px;
    margin-bottom:5px;
    letter-spacing:.01em;
  }
  .cart-row .info span{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .remove-link{
    background:none;
    border:none;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
    text-underline-offset:4px;
    text-decoration:underline;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-weight:500;
    white-space:nowrap;
  }
  .remove-link:hover{color:var(--gold);}

  /* ================= OVERLAY ================= */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(14,14,14,0.55);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .28s ease;
    z-index:1000;
    padding:20px;
  }
  .overlay.open{
    opacity:1;
    visibility:visible;
  }

  /* ================= MODAL ================= */
  .modal{
    background:var(--paper);
    width:min(420px, 100%);
    padding:48px 44px 38px;
    text-align:center;
    box-shadow:0 40px 80px -24px rgba(0,0,0,.4);
    transform:translateY(18px) scale(.96);
    transition:transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease;
    opacity:0;
    position:relative;
    border-top:1px solid var(--gold);
  }
  .overlay.open .modal{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  .icon-wrap{
    width:52px;
    height:52px;
    margin:0 auto 24px;
    border-radius:50%;
    background:var(--gold-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-wrap svg{
    width:22px;
    height:22px;
    stroke:var(--gold);
  }

  .eyebrow{
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }

  .modal h3{
    margin:0 0 14px;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-style:italic;
    font-size:26px;
    color:var(--ink);
    letter-spacing:.01em;
  }
  .modal p{
    margin:0 0 32px;
    font-size:13.5px;
    color:var(--muted);
    line-height:1.7;
    letter-spacing:.01em;
  }
  .modal p strong{
    color:var(--ink);
    font-weight:600;
  }

  .divider{
    width:36px;
    height:1px;
    background:var(--gold);
    margin:0 auto 24px;
  }

  .btn-row{
    display:flex;
    gap:12px;
  }
  .btn{
    flex:1;
    padding:15px 0;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:600;
    font-family:'Inter', sans-serif;
    border:1px solid var(--ink);
    cursor:pointer;
    transition:all .2s ease;
    background:none;
  }
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .btn-cancel{
    color:var(--ink);
    background:#fff;
  }
  .btn-cancel:hover{background:var(--sand);}

  .btn-confirm{
    background:var(--ink);
    color:#fff;
  }
  .btn-confirm:hover{background:#000;}

  @media (max-width:420px){
    .modal{padding:40px 28px 32px;}
    .modal h3{font-size:22px;}
  }
</style>
</head>
<body>

<!-- ================= DEMO CART ROWS — replace with real markup ================= -->
<div class="brand-bar">
  <div class="logo">Muslim Abaya</div>
  <div class="sub">Your Cart</div>
</div>

<div class="cart-row" id="cart-item-101">
  <div class="info">
    <strong>Abaya Muzdalifa 26</strong>
    <span>Color: Spice Beige &nbsp;·&nbsp; Size: Small – 52</span>
  </div>
  <button class="remove-link" data-item-id="101" data-item-name="Abaya Muzdalifa 26">Remove</button>
</div>

<div class="cart-row" id="cart-item-102">
  <div class="info">
    <strong>Karchupi Hijab</strong>
    <span>Color: Black &nbsp;·&nbsp; Size: Free</span>
  </div>
  <button class="remove-link" data-item-id="102" data-item-name="Karchupi Hijab">Remove</button>
</div>
<!-- ================================================================ -->

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4"/>
        <path d="M12 17h.01"/>
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
      </svg>
    </div>
    <div class="eyebrow">Confirm removal</div>
    <h3>Remove this item?</h3>
    <div class="divider"></div>
    <p id="modalMessage">This item will be removed from your cart. This action can't be undone.</p>
    <div class="btn-row">
      <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn btn-confirm" id="confirmBtn">Remove</button>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const modalMessage = document.getElementById('modalMessage');

  let pendingItemId = null;

  function openModal(itemId, itemName) {
    pendingItemId = itemId;
    modalMessage.innerHTML = itemName
      ? `<strong>"${itemName}"</strong> will be removed from your cart. This action can't be undone.`
      : `This item will be removed from your cart. This action can't be undone.`;
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
    pendingItemId = null;
  }

  document.querySelectorAll('.remove-link').forEach(link => {
    link.addEventListener('click', () => {
      openModal(link.dataset.itemId, link.dataset.itemName);
    });
  });

  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // --- Replace the inside of this function with your real removal logic ---
  async function removeItem(itemId) {
    try {
      // OPTION A: Call your backend API
      const response = await fetch(`/cart/remove/${itemId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' }
      });
      if (!response.ok) throw new Error('Server responded with an error');

      // OPTION B: If there's no backend call, just remove it from the DOM
      const row = document.getElementById(`cart-item-${itemId}`);
      if (row) row.remove();

      return true;
    } catch (err) {
      console.error('Error removing item:', err);
      alert('Something went wrong while removing the item. Please try again.');
      return false;
    }
  }

  confirmBtn.addEventListener('click', async () => {
    if (!pendingItemId) return;

    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Removing…';

    const success = await removeItem(pendingItemId);

    confirmBtn.disabled = false;
    confirmBtn.textContent = 'Remove';

    if (success) closeModal();
  });
</script>

</body>
</html>
