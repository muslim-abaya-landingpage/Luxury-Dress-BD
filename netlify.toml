# Muslim Abaya is a static multi-page site (HTML/CSS/JS at repo root).
# Do NOT run the leftover Vite/React "react-example" build — that only
# publishes dist/ and makes every page except the homepage 404.

[build]
  command = "node scripts/prepare-netlify-headers.mjs"
  publish = "."

[build.environment]
  # Skip framework auto-detection side effects when possible
  NODE_VERSION = "20"
  # Firebase web config in leftover React files (public client identifiers, not server secrets).
  # Netlify's secret scan flags the "AIza" key and fails the build with exit code 2.
  SECRETS_SCAN_OMIT_PATHS = "firebase-applet-config.json,src/firebase.ts"
