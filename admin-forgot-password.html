<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Admin Password Recovery | Muslim Abaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css?v=d800d917a0c7b197"><link rel="stylesheet" href="/admin-design-system.css?v=1eaf4362bddc4ad0">
<style>
*{box-sizing:border-box}.recovery-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f9;font-family:'Hind Siliguri',Arial,sans-serif}.recovery-card{width:min(440px,100%);background:#fff;border:1px solid #dce3ed;border-radius:20px;padding:clamp(24px,5vw,38px);box-shadow:0 20px 55px rgba(24,39,60,.1)}.recovery-mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#e0bd7c,#b88c45);margin:0 auto 16px}.recovery-card h1{text-align:center;font-size:25px;margin:0 0 5px;color:#17283d}.recovery-sub{text-align:center;color:#6a7788;margin:0 0 24px;font-size:14px}.recovery-card label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}.recovery-card input{width:100%;height:46px;border:1px solid #ccd7e5;border-radius:10px;padding:0 13px;font:inherit;font-size:15px;outline:none}.recovery-card input:focus{border-color:#bd914d;box-shadow:0 0 0 3px #bd914d22}.recovery-card button{width:100%;height:47px;margin-top:18px;border:0;border-radius:10px;background:#385779;color:#fff;font:700 15px 'Hind Siliguri',Arial,sans-serif;cursor:pointer}.recovery-card button:disabled{opacity:.6;cursor:wait}.recovery-msg{min-height:22px;margin:12px 0 0;font-size:13px;color:#a32f2b}.recovery-msg.ok{color:#16804a}.recovery-back{display:block;text-align:center;margin-top:18px;color:#385779;text-decoration:none;font-size:13px}.recovery-hidden{display:none!important}.recovery-note{background:#f5f7fa;border-radius:10px;padding:12px;margin-top:16px;color:#657286;font-size:12px;line-height:1.6}
</style><link rel="stylesheet" href="admin-responsive.css?v=1">
<link rel="stylesheet" href="admin-theme.css?v=1">
</head>
<body><main class="recovery-wrap"><section class="recovery-card">
<div class="recovery-mark" aria-hidden="true"></div><h1>Admin Password Recovery</h1><p class="recovery-sub">Muslim Abaya · Secure account access</p>
<form id="requestForm"><label for="recoveryEmail">Registered Admin Email</label><input id="recoveryEmail" type="email" autocomplete="username" maxlength="254" required placeholder="admin@example.com"><button id="sendCode" type="submit">Send Recovery Code</button></form>
<form id="confirmForm" class="recovery-hidden"><label for="recoveryCode">6-digit email code</label><input id="recoveryCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"><label for="newPassword">New Password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button id="savePassword" type="submit">Update Password</button></form>
<p id="recoveryMsg" class="recovery-msg" role="status" aria-live="polite"></p><div class="recovery-note">কোডটি ১০ মিনিটের মধ্যে ব্যবহার করুন। নিরাপত্তার জন্য ভুল কোড ৫ বার দিলে নতুন কোড নিতে হবে। অ্যাকাউন্ট আছে কি না, এই পেজ থেকে তা প্রকাশ করা হয় না।</div>
<a class="recovery-back" href="/admin-login">← Back to Admin Login</a>
</section></main>
<script src="/site-api-config.js?v=b4eb7cb7438aad24"></script><script src="/admin-config.js?v=admin-reset-20261105"></script><script src="/admin-api.js?v=admin-reset-20261105"></script>
<script>
(function(){
var request=document.getElementById('requestForm'),confirm=document.getElementById('confirmForm'),msg=document.getElementById('recoveryMsg'),email=document.getElementById('recoveryEmail');
function notice(text,ok){msg.textContent=text;msg.className='recovery-msg'+(ok?' ok':'');}
function busy(button,on,label){button.disabled=on;if(label)button.textContent=label;}
request.addEventListener('submit',function(e){e.preventDefault();var btn=document.getElementById('sendCode'),value=email.value.trim().toLowerCase();if(!value){notice('Registered email দিন।');return;}busy(btn,true,'Sending…');MaAdmin.requestPasswordReset(value).then(function(){confirm.classList.remove('recovery-hidden');email.readOnly=true;notice('যদি এই ইমেইলটি সক্রিয় Admin অ্যাকাউন্টের হয়, তাহলে ১০ মিনিটের Recovery Code পাঠানো হয়েছে। Inbox/Spam দেখুন।',true);document.getElementById('recoveryCode').focus();}).catch(function(){notice('রিকভারি রিকোয়েস্ট সম্পন্ন হয়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।');}).finally(function(){busy(btn,false,'Send Recovery Code');});});
confirm.addEventListener('submit',function(e){e.preventDefault();var btn=document.getElementById('savePassword'),code=document.getElementById('recoveryCode').value.trim(),password=document.getElementById('newPassword').value,again=document.getElementById('confirmPassword').value;if(!/^\d{6}$/.test(code)){notice('ইমেইলে পাওয়া ৬ সংখ্যার কোড দিন।');return;}if(password.length<8){notice('পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।');return;}if(password!==again){notice('দুটি পাসওয়ার্ড মিলছে না।');return;}busy(btn,true,'Updating…');MaAdmin.confirmPasswordReset(email.value,code,password).then(function(res){notice(res.message||'পাসওয়ার্ড পরিবর্তন হয়েছে।',true);confirm.classList.add('recovery-hidden');request.classList.add('recovery-hidden');setTimeout(function(){location.href='/admin-login';},1800);}).catch(function(err){notice(err.message||'কোডটি ভুল বা মেয়াদোত্তীর্ণ।');}).finally(function(){busy(btn,false,'Update Password');});});
})();
</script></body></html>
