<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>নতুন অ্যাডমিন পাসওয়ার্ড | Muslim Abaya</title>
  <link rel="stylesheet" href="admin.css?v=20260929modern1">
  <style>
    .recovery-hint{color:#616373;font-size:14px;line-height:1.7;margin:0 0 18px}
    .recovery-status{font-size:14px;line-height:1.6;min-height:34px;margin:12px 0}
    .recovery-status.error{color:#a02020}
    .recovery-status.success{color:#17633d}
    .recovery-links{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}
    .recovery-links a{color:#5f4bc7;font-weight:700;text-decoration:none}
    .recovery-links a:hover{text-decoration:underline}
  </style>
</head>
<body class="adm-body">
  <main class="adm-login-wrap">
    <section class="adm-login-card" aria-labelledby="resetTitle">
      <div class="adm-login-logo">
        <h1 id="resetTitle">নতুন পাসওয়ার্ড দিন</h1>
        <p>Muslim Abaya · Verified email reset</p>
      </div>
      <p class="recovery-hint">কমপক্ষে ১২ অক্ষরের একটি নতুন, অন্য কোথাও ব্যবহার না-করা পাসওয়ার্ড দিন। সফল হলে পুরোনো অ্যাডমিন লগইন সেশনগুলো বাতিল হবে।</p>
      <form id="resetForm" hidden>
        <div class="adm-field">
          <label for="newPassword">নতুন পাসওয়ার্ড</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <div class="adm-field">
          <label for="confirmPassword">পাসওয়ার্ড আবার লিখুন</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <button class="adm-btn adm-btn-primary" type="submit" id="resetSubmit">পাসওয়ার্ড পরিবর্তন করুন</button>
      </form>
      <p id="resetStatus" class="recovery-status" role="status" aria-live="polite"></p>
      <div class="recovery-links">
        <a href="admin-forgot-password.html">নতুন রিসেট লিংক নিন</a>
        <a href="admin-login.html">অ্যাডমিন লগইনে ফিরুন</a>
      </div>
    </section>
  </main>
  <script src="site-api-config.js?v=20261009-inbox"></script>
  <script src="admin-config.js?v=20261009-inbox"></script>
  <script src="admin-api.js?v=20261023-recovery1"></script>
  <script>
    (function () {
      // URL fragments are never sent to the server. Scrub the token from browser history.
      var params = new URLSearchParams(location.hash.replace(/^#/, ""));
      var email = String(params.get("email") || "").trim().toLowerCase();
      var token = String(params.get("token") || "").trim();
      if (window.history && history.replaceState) history.replaceState(null, document.title, location.pathname);
      var form = document.getElementById("resetForm");
      var button = document.getElementById("resetSubmit");
      var status = document.getElementById("resetStatus");
      function show(message, failed) {
        status.textContent = message;
        status.className = "recovery-status " + (failed ? "error" : "success");
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !/^[a-f0-9]{64}$/.test(token)) {
        show("রিসেট লিংক সঠিক নয়। নতুন লিংকের অনুরোধ করুন।", true);
        return;
      }
      form.hidden = false;
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var password = document.getElementById("newPassword").value;
        var repeat = document.getElementById("confirmPassword").value;
        if (password.length < 12 || password.length > 128) {
          show("নতুন পাসওয়ার্ড ১২–১২৮ অক্ষরের হতে হবে।", true);
          return;
        }
        if (password !== repeat) {
          show("দুটি পাসওয়ার্ড মেলেনি।", true);
          return;
        }
        button.disabled = true;
        button.textContent = "পরিবর্তন হচ্ছে…";
        show("", false);
        MaAdmin.confirmPasswordReset({ email: email, token: token, newPassword: password })
          .then(function () {
            token = "";
            document.getElementById("newPassword").value = "";
            document.getElementById("confirmPassword").value = "";
            form.hidden = true;
            show("পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে। এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।", false);
          })
          .catch(function (err) {
            show(String(err && err.message || "লিংকের মেয়াদ শেষ হতে পারে। নতুন রিসেট লিংক নিন।"), true);
          })
          .finally(function () {
            button.disabled = false;
            button.textContent = "পাসওয়ার্ড পরিবর্তন করুন";
          });
      });
    })();
  </script>
</body>
</html>
