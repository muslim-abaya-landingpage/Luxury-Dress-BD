<body class="am-body si-body">
<div id="site-header-mount"></div>

<main class="si-main">
  <section class="si-card" aria-labelledby="si-title">
    <a class="si-logo" href="/" aria-label="Muslim Abaya home">
      <img src="assets/brand/muslim-abaya-logo-icon-dark.svg" alt="" width="40" height="40">
      <span>Muslim Abaya</span>
    </a>
    <h1 id="si-title">Sign in</h1>
    <p class="si-sub">Track your orders and check out faster.</p>

    <section class="am-social-login" aria-label="Sign in with Google or Facebook">
      <div class="am-social-grid">
        <div class="am-social-google">
          <div id="maGoogleButtonHost" hidden></div>
          <button class="am-social-btn" id="maGoogleFallback" type="button" disabled>
            <span class="am-social-mark is-google" aria-hidden="true">G</span><span>Sign in with Google</span>
          </button>
        </div>
        <button class="am-social-btn" id="maFacebookButton" type="button" hidden disabled>
          <span class="am-social-mark is-facebook" aria-hidden="true">f</span><span>Sign in with Facebook</span>
        </button>
      </div>
      <p class="am-social-status" id="maSocialStatus" role="status"></p>
      <div class="am-social-divider"><span>or use email / mobile</span></div>
    </section>

    <form id="signinForm" novalidate>
      <div class="am-field">
        <label for="si-login">Email or mobile number</label>
        <div class="am-input"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.6 3.9-5.4 7.5-5.4s6.7 1.8 7.5 5.4"/></svg><input type="text" id="si-login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com or 01XXXXXXXXX" required></div>
      </div>
      <div class="am-field">
        <div class="si-label-row"><label for="si-pass">Password</label><a class="si-forgot" href="/forgot-password">Forgot password?</a></div>
        <div class="am-input has-toggle"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><input type="password" id="si-pass" name="password" autocomplete="current-password" placeholder="Your password" required><button type="button" class="am-eye" data-am-eye="si-pass" aria-label="Show password" aria-pressed="false"><svg class="am-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="am-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.5 6.6A17.7 17.7 0 0 0 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
      </div>

      <p class="form-msg" id="signinMsg" role="alert"></p>

      <button class="am-btn" id="signinBtn" type="submit">Sign in</button>
    </form>

    <p class="si-switch">New to Muslim Abaya? <a id="signupLink" href="/signup">Create an account</a></p>
  </section>

  <ul class="si-perks" aria-label="Why shop with Muslim Abaya">
    <li>Cash on delivery, nationwide</li>
    <li>Easy returns</li>
    <li>Help on <a href="https://wa.me/8801971642683" target="_blank" rel="noopener">WhatsApp</a></li>
  </ul>
</main>
