<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Muslim Abaya</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site-header.css?v=20260820fixui">
<link rel="stylesheet" href="site-footer.css?v=20260929glassft" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="site-footer.css?v=20260929glassft"></noscript>
<link rel="stylesheet" href="mobile-bottom-nav.css">
<link rel="stylesheet" href="auth-page.css">
<link rel="stylesheet" href="auth-modern.css?v=20261003am">
<script src="config.js"></script>
</head>
<body class="am-body">
<div id="site-header-mount"></div>

<main class="am-main">
  <div class="am-shell">
    <aside class="am-brand">
      <a class="am-logo" href="/" aria-label="Muslim Abaya home">
        <img src="assets/brand/muslim-abaya-logo-icon-dark.svg" alt="" width="52" height="52">
        <span class="am-logo-text"><small>Muslim</small><strong>Abaya</strong></span>
      </a>
      <h1>Welcome <em>back</em></h1>
      <p class="am-brand-lead">Sign in to track your orders and check out faster.</p>
      <ul class="am-perks">
        <li><span class="am-perk-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></span>Cash on delivery, nationwide</li>
        <li><span class="am-perk-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg></span>Easy return policy</li>
        <li><span class="am-perk-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 20 7v10l-8 4.2L4 17V7z"/><path d="M4 7l8 4.2L20 7M12 11.2v10"/></svg></span>Track your order anytime</li>
      </ul>
      <p class="am-brand-foot">Need help? <a href="https://wa.me/8801970831783" target="_blank" rel="noopener">Chat with us on WhatsApp</a></p>
    </aside>

    <section class="am-form-wrap" aria-label="Sign In">
      <div class="am-form form-box">
        <span class="am-eyebrow">Welcome back</span>
        <h2>Sign in</h2>
        <p class="am-sub">Use your email or mobile number.</p>

        <form id="signinForm" novalidate>
          <div class="am-field">
            <label for="si-login">Email or mobile</label>
            <div class="am-input"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.6 3.9-5.4 7.5-5.4s6.7 1.8 7.5 5.4"/></svg><input type="text" id="si-login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com or 01XXXXXXXXX"></div>
          </div>
          <div class="am-field">
            <label for="si-pass">Password</label>
            <div class="am-input has-toggle"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><input type="password" id="si-pass" name="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="am-eye" data-am-eye="si-pass" aria-label="Show password" aria-pressed="false"><svg class="am-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="am-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.5 6.6A17.7 17.7 0 0 0 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
          </div>

          <p class="form-msg" id="signinMsg" role="alert" aria-live="polite"></p>

          <button class="am-btn" id="signinBtn" type="submit">Sign in</button>
        </form>

        <p class="am-switch">New to Muslim Abaya? <a id="signupLink" href="signup.html">Create an account</a></p>
      </div>
    </section>
  </div>
</main>

<div id="site-footer-mount"></div>
<script src="cart-utils.js?v=20261002fix"></script>
  <script src="site-security.js"></script>
  <script src="site-api-config.js?v=20261003g"></script>
  <script src="site-api-health.js"></script>
  <script src="auth-config.js"></script>
  <script src="auth-api.js?v=20261003g"></script>
  <script defer src="auth-ui.js?v=20261003am"></script>
  <script defer src="google-signin.js?v=20261003am2"></script>
  <script defer src="site-header.js?v=20261002gtm"></script>
  <script src="site-footer.js?v=20261003tt"></script>
  <script>
    (function () {
      if (typeof showAuthApiNotice === 'function') {
        showAuthApiNotice('.form-box');
      }
      var form = document.getElementById('signinForm');
      if (!form) return;
      var params = new URLSearchParams(window.location.search);
      var nextUrl = params.get('next') || 'checkout.html';
      var signupLink = document.getElementById('signupLink');
      if (signupLink && params.get('next')) {
        signupLink.href = 'signup.html?next=' + encodeURIComponent(params.get('next'));
      }
      var msg = document.getElementById('signinMsg');
      function fail(text, fieldId) {
        msg.className = 'form-msg is-error';
        msg.textContent = text;
        var f = fieldId && document.getElementById(fieldId);
        if (f) f.focus();
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        msg.className = 'form-msg';
        msg.textContent = '';
        var login = document.getElementById('si-login').value.trim();
        var pass = document.getElementById('si-pass').value;
        if (!login) { fail('Enter your email or mobile number.', 'si-login'); return; }
        if (!pass) { fail('Enter your password.', 'si-pass'); return; }
        var btn = document.getElementById('signinBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';
        MaAuth.login({ login: login, password: pass })
          .then(function () {
            msg.className = 'form-msg is-ok';
            msg.textContent = 'Signed in — redirecting...';
            window.location.href = nextUrl;
          })
          .catch(function (err) {
            if (typeof isLocalPreview === 'function' && isLocalPreview()) {
              alert(typeof getLocalFileAuthHint === 'function' ? getLocalFileAuthHint() : 'Run the local server and open http://127.0.0.1/signin.html to test sign in.');
              return;
            }
            msg.className = 'form-msg is-error';
            msg.textContent = (err && err.message) || 'Sign in failed. Check your email/phone and password.';
          })
          .finally(function () {
            btn.disabled = false;
            btn.innerHTML = 'Sign in';
          });
      });
    })();
  </script>
<script defer src="mobile-bottom-nav.js"></script>
</body>
</html>
