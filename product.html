  <style>
    :root {
      --ink: #111111;
      --ink-soft: #3d3d3d;
      --muted: #6b6b6b;
      --line: #ececec;
      --bg: #ffffff;
      --card: #ffffff;
      --gold: #111111;
      --gold-soft: #f5f5f5;
      --shadow: 0 1px 4px rgba(17, 17, 17, 0.05);
      --shadow-sm: 0 1px 3px rgba(17, 17, 17, 0.04);
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--ink-soft);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .pd-wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }

    /* ---------- Breadcrumb ---------- */
    .pd-breadcrumb { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
    .pd-breadcrumb a { color: var(--muted); text-decoration: none; }
    .pd-breadcrumb a:hover { color: var(--ink); text-decoration: underline; }
    .pd-breadcrumb span.sep { margin: 0 6px; opacity: .6; }
    .pd-breadcrumb span.current { color: var(--ink); font-weight: 600; }

    /* ---------- Layout ---------- */
    .pd-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(320px, 0.78fr);
      gap: 40px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .pd-layout { grid-template-columns: 1fr; gap: 20px; }
    }

    /* ---------- Gallery ---------- */
    .pd-gallery { display: flex; gap: 14px; }
    .pd-thumbs { display: flex; flex-direction: column; gap: 10px; width: 76px; flex-shrink: 0; }
    .pd-thumb {
      width: 76px; height: 96px; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--line); cursor: pointer; padding: 0; background: #fff;
    }
    .pd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pd-thumb.is-active { border-color: var(--ink); border-width: 2px; }
    .pd-main-image {
      position: relative; flex: 1; border-radius: var(--radius); overflow: hidden;
      background: var(--gold-soft); aspect-ratio: 3 / 4;
    }
    .pd-main-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pd-gallery-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.9);
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;
      box-shadow: var(--shadow);
    }
    .pd-gallery-arrow.prev { left: 12px; }
    .pd-gallery-arrow.next { right: 12px; }
    @media (max-width: 640px) {
      .pd-gallery { flex-direction: column-reverse; }
      .pd-thumbs { flex-direction: row; width: 100%; overflow-x: auto; }
      .pd-thumb { width: 60px; height: 76px; flex-shrink: 0; }
    }

    /* ---------- Info panel ---------- */
    .pd-info { padding-top: 4px; }
    .pd-name { font-size: 26px; font-weight: 700; color: var(--ink); margin: 0 0 10px; line-height: 1.3; }
    .pd-price { font-size: 26px; font-weight: 800; color: var(--ink); margin-bottom: 4px; font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    .pd-price .from { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 6px; }
    .pd-shortnote { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; }

    .pd-option-group { margin-bottom: 16px; }
    .pd-option-label { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); margin-bottom: 8px; }
    .pd-option-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .pd-option-btn {
      padding: 10px 16px; border: 1px solid var(--line); border-radius: var(--radius);
      background: #fff; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
    }
    .pd-option-btn.is-active { border-color: var(--ink); color: var(--ink); background: var(--gold-soft); }
    .pd-custom-size-btn { font-weight: 700; }
    .pd-size-chart-link { font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: underline; margin-left: 6px; white-space: nowrap; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }

    /* ---------- Size chart modal (table-based, no external image) ---------- */
    .pd-sc-overlay {
      position: fixed; inset: 0; background: rgba(17,17,17,.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s ease;
      z-index: 100200; padding: 20px;
    }
    .pd-sc-overlay.is-open { opacity: 1; visibility: visible; }
    .pd-sc-dialog {
      position: relative; width: min(560px, 100%); max-height: 85vh; overflow-y: auto;
      background: #fff; border-radius: var(--radius); padding: 26px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .pd-sc-close {
      position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--line); background: #fff; font-size: 18px; cursor: pointer;
    }
    .pd-sc-title { font-size: 18px; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 18px; }
    .pd-sc-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
    .pd-sc-card-title { background: var(--gold-soft); color: var(--ink); text-align: center; padding: 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--line); }
    .pd-sc-card table { width: 100%; border-collapse: collapse; }
    .pd-sc-card th, .pd-sc-card td { padding: 10px 8px; text-align: center; font-size: 13.5px; border-bottom: 1px solid var(--line); }
    .pd-sc-card th { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 11.5px; }
    .pd-sc-card tbody tr:last-child td { border-bottom: none; }
    .pd-sc-card tbody tr:nth-child(even) { background: #fafafa; }

    .pd-qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
    .pd-qty-stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .pd-qty-stepper button { width: 36px; height: 36px; border: none; background: #fff; font-size: 16px; cursor: pointer; }
    .pd-qty-stepper button:hover { background: var(--gold-soft); }
    .pd-qty-stepper span { width: 40px; text-align: center; font-weight: 700; }
    .pd-stock { font-size: 12.5px; color: var(--muted); }

    .pd-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .pd-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 14px 10px; border-radius: var(--radius); font-size: 13.5px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--ink); text-align: center; text-decoration: none;
    }
    .pd-btn-outline { background: #fff; color: var(--ink); }
    .pd-btn-outline:hover { background: var(--gold-soft); }
    .pd-btn-dark { background: var(--ink); color: #fff; }
    .pd-btn-dark:hover { background: #000; }
    .pd-btn-light { background: var(--gold-soft); color: var(--ink); border-color: var(--line); }
    .pd-btn-light:hover { background: #ececec; }
    .pd-btn.is-added { background: #0d6b4d; border-color: #0d6b4d; color: #fff; }
    @media (max-width: 480px) {
      .pd-actions { grid-template-columns: 1fr; }
    }

    /* ---------- Bottom section: Description/Specification (left) + Related Products (right) ----------
       These two used to be separate full-width blocks stacked vertically. The Muslim Abaya puts
       them side by side in the same row, so they're now wrapped together in .pd-bottom-grid. */
    .pd-bottom-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr);
      gap: 48px;
      align-items: start;
      margin-top: 48px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }
    @media (max-width: 900px) {
      .pd-bottom-grid { grid-template-columns: 1fr; gap: 28px; }
    }

    /* ---------- Tabs (left column) ---------- */
    .pd-tabs-section { margin-top: 0; border-top: none; padding-top: 0; }
    .pd-tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .pd-tab { background: none; border: none; padding: 0 0 12px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .pd-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
    .pd-tab-panel { display: none; font-size: 14px; }
    .pd-tab-panel.active { display: block; }
    .pqv-desc-rich, .pqv-desc-rich p, .pqv-desc-rich li { text-align: justify; }
    .pqv-desc-rich ol { padding-left: 18px; }
    .pd-spec-table { width: 100%; border-collapse: collapse; max-width: 560px; }
    .pd-spec-table td { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pd-spec-table td:first-child { color: var(--muted); width: 160px; }
    .pd-spec-table td:last-child { color: var(--ink); font-weight: 600; }

    /* ---------- Related products (right column) — vertical list, matching the Muslim Abaya sidebar look ---------- */
    .pd-related { margin-top: 0; }
    .pd-related-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    .pd-related-head h2 { font-size: 20px; margin: 0; color: var(--ink); }
    .pd-related-head a { font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: underline; }
    .pd-related-row { display: flex; flex-direction: column; gap: 16px; }
    .pd-rel-card { text-decoration: none; color: inherit; display: flex; gap: 12px; align-items: center; }
    .pd-rel-card img { width: 64px; height: 82px; flex-shrink: 0; object-fit: cover; border-radius: var(--radius); background: var(--gold-soft); display: block; }
    .pd-rel-card .pd-rel-info { min-width: 0; }
    .pd-rel-card .name { font-size: 13px; font-weight: 600; color: var(--ink); margin: 0 0 4px; line-height: 1.35; }
    .pd-rel-card .price { font-size: 13px; font-weight: 700; color: var(--ink); }

    .pd-loading, .pd-notfound { padding: 80px 0; text-align: center; color: var(--muted); }

    /* ---------- Reviews ---------- */
    .pd-reviews { margin-top: 48px; }
    .pd-reviews-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .pd-reviews-head h2 { font-size: 20px; margin: 0; color: var(--ink); }
    .pd-reviews-nav { display: flex; gap: 8px; }
    .pd-reviews-nav button {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
      background: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    }
    .pd-reviews-nav button:hover { background: var(--gold-soft); }
    .pd-reviews-row {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    }
    .pd-reviews-row.pd-slide-in-right { animation: pdSlideInRight .38s ease; }
    .pd-reviews-row.pd-slide-in-left { animation: pdSlideInLeft .38s ease; }
    @keyframes pdSlideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pdSlideInLeft {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @media (max-width: 640px) {
      .pd-reviews-row { grid-template-columns: 1fr; }
    }
    .pd-review-card {
      display: flex; gap: 14px; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
      background: #fff;
    }
    .pd-review-photo { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--gold-soft); }
    .pd-review-avatar {
      width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; background: var(--ink);
      color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;
    }
    .pd-review-body { flex: 1; min-width: 0; }
    .pd-review-quote { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 8px; line-height: 1.6; }
    .pd-review-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  </style>
