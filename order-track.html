<html lang="bn">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --ink: #111111;
      --ink-soft: #3d3d3d;
      --muted: #6b6b6b;
      --line: #ececec;
      --bg-card: #ffffff;
      --accent: #111111;
      --ok: #1a7f37;
      --warn: #b45309;
      --bad: #b91c1c;
    }
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
      color: var(--ink-soft);
    }
    #site-header-mount + * { margin-top: 0 !important; }
    #site-header-mount { margin-bottom: 0 !important; padding-bottom: 0 !important; }

    .track-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }
    .track-hero { text-align: center; margin-bottom: 26px; }
    .track-hero h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .track-hero p { margin: 0 auto; font-size: 14.5px; color: var(--muted); max-width: 460px; line-height: 1.6; }

    .track-form {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(17,17,17,0.04);
    }
    .track-field { margin-bottom: 14px; }
    .track-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .track-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .track-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(17,17,17,0.06); }
    .track-field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

    .track-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s ease, transform .1s ease;
    }
    .track-submit:hover { opacity: .9; }
    .track-submit:active { transform: translateY(1px); }
    .track-submit:disabled { opacity: .55; cursor: not-allowed; }

    .track-msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .track-msg.show { display: block; }
    .track-msg.error { background: #fef2f2; color: var(--bad); border: 1px solid #fecaca; }
    .track-msg.empty { background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }

    .order-list { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
    .order-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 10px rgba(17,17,17,0.03);
    }
    .order-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .order-id { font-weight: 700; color: var(--ink); font-size: 14.5px; }
    .order-date { font-size: 12.5px; color: var(--muted); }
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-pending { background: #fffbeb; color: var(--warn); }
    .status-confirmed { background: #eff6ff; color: #1d4ed8; }
    .status-shipped { background: #eef2ff; color: #4338ca; }
    .status-delivered { background: #ecfdf5; color: var(--ok); }
    .status-cancelled { background: #fef2f2; color: var(--bad); }

    .order-detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      padding: 6px 0;
      border-top: 1px dashed var(--line);
    }
    .order-detail-row:first-of-type { border-top: none; padding-top: 0; }
    .order-detail-row span:first-child { color: var(--muted); }
    .order-detail-row span:last-child { color: var(--ink-soft); font-weight: 600; text-align: right; }

    .track-loading { text-align: center; padding: 20px; color: var(--muted); font-size: 14px; display: none; }
    .track-loading.show { display: block; }

    @media (max-width: 480px) {
      .track-wrap { padding: 20px 14px 50px; }
      .track-form { padding: 16px; }
    }
  </style>

<body class="order-track-page">

  <div id="site-header-mount"></div>

  <main class="track-wrap">
    <header class="track-hero">
      <h1>অর্ডার ট্র্যাক করুন</h1>
      <p>আপনার মোবাইল নম্বর দিয়ে সহজেই দেখুন আপনার অর্ডারের সর্বশেষ অবস্থা — লগইন ছাড়াই।</p>
    </header>

    <form class="track-form" id="trackForm">
      <div class="track-field">
        <label for="trackPhone">মোবাইল নম্বর *</label>
        <input type="tel" id="trackPhone" name="phone" placeholder="01XXXXXXXXX" required inputmode="numeric" autocomplete="tel">
      </div>
      <div class="track-field">
        <label for="trackOrderId">অর্ডার আইডি (ঐচ্ছিক)</label>
        <input type="text" id="trackOrderId" name="orderId" placeholder="যেমন: MA-10234">
        <div class="hint">অর্ডার আইডি না জানলে খালি রাখুন — সব অর্ডার দেখাবে।</div>
      </div>
      <button type="submit" class="track-submit" id="trackSubmitBtn">ট্র্যাক করুন</button>
      <div class="track-msg" id="trackMsg"></div>
    </form>

    <div class="track-loading" id="trackLoading">খোঁজা হচ্ছে…</div>
    <div class="order-list" id="orderList"></div>
  </main>

  <div id="site-footer-mount"></div>

  <script>
    (function () {
      var STATUS_LABELS = {
        pending: 'অপেক্ষমান',
        confirmed: 'কনফার্মড',
        shipped: 'কুরিয়ারে পাঠানো হয়েছে',
        delivered: 'ডেলিভারি সম্পন্ন',
        cancelled: 'বাতিল'
      };

      function statusClassAndLabel(rawStatus) {
        var s = String(rawStatus || 'Pending').toLowerCase();
        if (s.indexOf('cancel') !== -1) return { cls: 'status-cancelled', label: STATUS_LABELS.cancelled };
        if (s.indexOf('deliver') !== -1) return { cls: 'status-delivered', label: STATUS_LABELS.delivered };
        if (s.indexOf('ship') !== -1 || s.indexOf('courier') !== -1) return { cls: 'status-shipped', label: STATUS_LABELS.shipped };
        if (s.indexOf('confirm') !== -1) return { cls: 'status-confirmed', label: STATUS_LABELS.confirmed };
        return { cls: 'status-pending', label: STATUS_LABELS.pending };
      }

      function formatDate(iso) {
        if (!iso) return '';
        try {
          var d = new Date(iso);
          return d.toLocaleDateString('bn-BD', { year: 'numeric', month: 'short', day: 'numeric' });
        } catch (e) { return ''; }
      }

      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderOrders(orders) {
        var listEl = document.getElementById('orderList');
        listEl.innerHTML = '';
        orders.forEach(function (o) {
          var st = statusClassAndLabel(o.status);
          var card = document.createElement('div');
          card.className = 'order-card';
          var rows = '';
          if (o.product) rows += '<div class="order-detail-row"><span>প্রোডাক্ট</span><span>' + esc(o.product) + '</span></div>';
          if (o.qty) rows += '<div class="order-detail-row"><span>পরিমাণ</span><span>' + esc(o.qty) + '</span></div>';
          if (o.total) rows += '<div class="order-detail-row"><span>মোট মূল্য</span><span>৳' + esc(o.total) + '</span></div>';
          if (o.tracking) rows += '<div class="order-detail-row"><span>ট্র্যাকিং নম্বর</span><span>' + esc(o.tracking) + '</span></div>';
          if (o.courierStatus) rows += '<div class="order-detail-row"><span>কুরিয়ার স্ট্যাটাস</span><span>' + esc(o.courierStatus) + '</span></div>';
          if (o.district) rows += '<div class="order-detail-row"><span>জেলা</span><span>' + esc(o.district) + '</span></div>';
          card.innerHTML =
            '<div class="order-card-top">' +
              '<span class="order-id">অর্ডার #' + esc(o.orderId || '—') + '</span>' +
              '<span class="status-badge ' + st.cls + '">' + st.label + '</span>' +
            '</div>' +
            '<div class="order-date">' + formatDate(o.date) + '</div>' +
            '<div style="margin-top:10px;">' + rows + '</div>';
          listEl.appendChild(card);
        });
      }

      function showMsg(kind, text) {
        var msgEl = document.getElementById('trackMsg');
        msgEl.className = 'track-msg show ' + kind;
        msgEl.textContent = text;
      }

      function clearMsg() {
        var msgEl = document.getElementById('trackMsg');
        msgEl.className = 'track-msg';
        msgEl.textContent = '';
      }

      document.getElementById('trackForm').addEventListener('submit', function (e) {
        e.preventDefault();
        clearMsg();
        document.getElementById('orderList').innerHTML = '';

        var phone = document.getElementById('trackPhone').value.trim();
        var orderId = document.getElementById('trackOrderId').value.trim();
        var digits = phone.replace(/[^\d]/g, '');
        if (digits.length < 10) {
          showMsg('error', 'সঠিক মোবাইল নম্বর দিন (যেমন: 01712345678)।');
          return;
        }

        var apiUrl = (window.MA_SITE_API && window.MA_SITE_API.url) || '';
        if (!apiUrl) {
          showMsg('error', 'সার্ভিস সাময়িকভাবে অনুপলব্ধ। কিছুক্ষণ পর আবার চেষ্টা করুন।');
          return;
        }

        var btn = document.getElementById('trackSubmitBtn');
        var loadingEl = document.getElementById('trackLoading');
        btn.disabled = true;
        loadingEl.classList.add('show');

        var qs = 'RecordType=OrderTrack&Phone=' + encodeURIComponent(phone);
        if (orderId) qs += '&OrderId=' + encodeURIComponent(orderId);

        fetch(apiUrl + '?' + qs)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            btn.disabled = false;
            loadingEl.classList.remove('show');
            if (!data || data.ok !== true) {
              showMsg('error', (data && data.message) || 'কিছু একটা ভুল হয়েছে। আবার চেষ্টা করুন।');
              return;
            }
            if (!data.orders || !data.orders.length) {
              showMsg('empty', 'এই নম্বরে কোনো অর্ডার পাওয়া যায়নি। নম্বর ও অর্ডার আইডি ঠিক আছে কিনা যাচাই করুন।');
              return;
            }
            renderOrders(data.orders);
          })
          .catch(function () {
            btn.disabled = false;
            loadingEl.classList.remove('show');
            showMsg('error', 'নেটওয়ার্ক সমস্যা হয়েছে। আবার চেষ্টা করুন।');
          });
      });
    })();
  </script>
