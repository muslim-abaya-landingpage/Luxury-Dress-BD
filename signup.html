<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | Muslim Abaya</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="site-header.css?v=20260603logo">
<link rel="stylesheet" href="site-footer.css?v=20260603footen" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="site-footer.css?v=20260603footen"></noscript>

<link rel="stylesheet" href="auth-page.css">

<script src="config.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;    
}

body {
    display: flex;
    flex-direction: column; /* এলিমেন্টগুলোকে ওপর-নিচে সাজাবে */
    align-items: center;
    justify-content: space-between; /* ফর্ম মাঝে রাখবে এবং ফুটার নিচে ঠেলে দেবে */
    min-height: 100vh;
    background: #f6f1e8;
}

.container {
    width: 900px;
    height: 560px;
    background: #f8f4ec;
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    box-shadow:
        18px 18px 35px rgba(0,0,0,.08),
        -10px -10px 25px rgba(255,255,255,.9);
    margin: auto 0; /* ফর্মটিকে স্ক্রিনের একদম মাঝখানে (vertically center) রাখবে */
}

.left{
    width:50%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#f7f2ea;
    overflow:hidden;
}

.left::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    background:#f2eee5;
    border-radius:50%;
    top:-100px;
    left:-70px;
    box-shadow:
    inset 8px 8px 12px rgba(0,0,0,.04),
    inset -8px -8px 12px rgba(255,255,255,.8);
}

.left::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:#f2eee5;
    border-radius:50%;
    bottom:-140px;
    left:-90px;
    box-shadow:
    inset 8px 8px 12px rgba(0,0,0,.04),
    inset -8px -8px 12px rgba(255,255,255,.8);
}

.content{
    z-index:5;
    width:75%;
}

.content h2{
    font-size:38px;
    color:#1d1d1d;
    margin-bottom:18px;
}

.content p{
    color:#666;
    line-height:1.8;
    margin-bottom:35px;
}

.switch-btn{
    border:none;
    cursor:pointer;
    background:#ece8e0;
    color:#222;
    padding:14px 45px;
    border-radius:30px;
    font-weight:600;
    letter-spacing:1px;
    box-shadow:
    8px 8px 18px rgba(0,0,0,.08),
    -8px -8px 18px rgba(255,255,255,.9);
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8f4ec;
}

.form-box{
    width:78%;
    text-align:center;
}

.form-box h2{
    font-size:38px;
    margin-bottom:20px;
    color:#222;
}

.social{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:25px;
}

.social a{
    width:42px;
    height:42px;
    background:#f5f1ea;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    color:#333;
    font-weight:600;
    box-shadow:
    6px 6px 12px rgba(0,0,0,.08),
    -6px -6px 12px rgba(255,255,255,.9);
}

.small{
    color:#999;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:20px;
}

.input-box{
    width:100%;
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    background:#f5f1ea;
    border-radius:10px;
    box-shadow:
    inset 3px 3px 6px rgba(0,0,0,.05),
    inset -3px -3px 6px rgba(255,255,255,.9);
}

.signup-btn{
    margin-top:12px;
    border:none;
    cursor:pointer;
    padding:15px 60px;
    border-radius:30px;
    background:#1d2d45;
    color:#fff;
    font-weight:600;
    letter-spacing:1px;
    box-shadow:0 10px 20px rgba(29,45,69,.25);
}

.signup-btn:hover{
    transform:translateY(-2px);
}

.switch-btn:hover{
    transform:translateY(-2px);
}

@media(max-width:900px){

.container{
    width:95%;
    height:auto;
    flex-direction:column;
}

.left,
.right{
    width:100%;
    padding:60px 20px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="left">
  <div class="content">
    <h2>Welcome Back !</h2>
    <p>
      To keep connected with us please login
      with your personal info
    </p>

    <button class="switch-btn" id="signinLink" type="button"
      onclick="window.location.href='signin.html'">
      SIGN IN
    </button>
  </div>
</div>

<div class="right">
  <div class="form-box">
    <h2>Create Account</h2>

    <div class="social">
      <a href="https://www.facebook.com/muslimabayaofficial" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="https://www.linkedin.com/in/muslimabayabd/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fab fa-linkedin-in"></i>
      </a>
      <a href="https://x.com/muslimabayashop" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <i class="fab fa-x-twitter"></i>
      </a>
    </div>

    <div class="small">OR USE EMAIL FOR REGISTRATION</div>

    <form id="signupForm">
      <div class="input-box">
        <input type="text" id="su-name" placeholder="Name">
      </div>

      <div class="input-box">
        <input type="text" id="su-mobile" placeholder="Mobile">
      </div>

      <div class="input-box">
        <input type="email" id="su-email" placeholder="Email">
      </div>

      <div class="input-box">
        <input type="password" id="su-pass" placeholder="Password">
      </div>

      <div class="input-box">
        <input type="password" id="su-confirm" placeholder="Confirm Password">
      </div>

      <button class="signup-btn" id="signupBtn" type="submit">
        SIGN UP
      </button>
    </form>
  </div>
</div>
</section>
  </main>
  <div id="site-footer-mount"></div>
  <script src="cart-utils.js"></script>
  <script src="site-security.js"></script>
  <script src="site-api-config.js?v=20260529"></script>
  <script src="site-api-health.js"></script>
  <script src="auth-config.js"></script>
  <script src="auth-api.js"></script>
  <script defer src="site-header.js?v=20260603logo"></script>
  <script src="site-footer.js?v=20260603footen"></script>
  <script>
    (function () {
      if (typeof showAuthApiNotice === 'function') {
        showAuthApiNotice('.auth-card');
      }
      var form = document.getElementById('signupForm');
      if (!form) return;
      var params = new URLSearchParams(window.location.search);
      var nextUrl = params.get('next') || 'checkout.html';
      var signinLink = document.getElementById('signinLink');
      if (signinLink && params.get('next')) {
        signinLink.href = 'signin.html?next=' + encodeURIComponent(params.get('next'));
      }
      form.addEventListener('submit', function (e) {
         e.preventDefault();
         var name = document.getElementById('su-name').value.trim();
         var phone = document
        .getElementById('su-mobile')
        .value
        .replace(/\D/g, '');
        var email = document
        .getElementById('su-email')
        .value
        .trim()
        .toLowerCase();
        var pass = document.getElementById('su-pass').value;
        var confirm = document.getElementById('su-confirm').value;
        if (name.length < 2) { alert('Please enter your full name.'); return; }
        if (!/^01\d{9}$/.test(phone.replace(/\s+/g, ''))) { alert('Enter a valid 11-digit mobile number.'); return; }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Enter a valid email address.'); return; }
        var strength = MaSecurity.checkPasswordStrength(pass);
        if (!strength.ok) { alert(strength.message); return; }
        if (pass !== confirm) { alert('Passwords do not match.'); return; }
        var btn = document.getElementById('signupBtn');
        btn.disabled = true;
        btn.innerHTML =
        '<span class="spinner"></span> Creating Account...';
        MaAuth.register({ name: name, phone: phone, email: email, password: pass })
          .then(function () {
            window.location.href = nextUrl;
          })
          .catch(function (err) {
            if (typeof isLocalPreview === 'function' && isLocalPreview()) {
              alert(typeof getLocalFileAuthHint === 'function' ? getLocalFileAuthHint() : 'Run the local server and open http://127.0.0.1/signup.html to test sign up.');
              return;
            }
            alert((err && err.message) || 'Registration failed. Please try again.');
          })
          .finally(function () {
            btn.disabled = false;
            btn.innerHTML='Create Account';
          });
      });
    })();
  </script>
</body>
</html>
