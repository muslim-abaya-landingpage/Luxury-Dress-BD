<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Muslim Abaya</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-header.css?v=20260603logo">
  <link rel="stylesheet" href="site-footer.css?v=20260603footen" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="site-footer.css?v=20260603footen"></noscript>
  <link rel="stylesheet" href="auth-page.css">
  <script src="config.js"></script>

  <!-- Modern UI Design Stylesheet -->
  <style>
:root{
    --primary-color:#1d2d45;
    --accent-color:#2563eb;
    --accent-hover:#1d4ed8;
    --bg-color:#eef3f9;
    --card-bg:rgba(255,255,255,.85);
    --text-main:#0f172a;
    --text-muted:#64748b;
    --border-color:#dbe4f0;
}

*{
    box-sizing:border-box;
}

body.auth-page-signup{
    margin:0;
    padding:0;
    font-family:'Inter',sans-serif;
    color:var(--text-main);
    background:
        radial-gradient(circle at top left,#dbeafe 0%,transparent 35%),
        radial-gradient(circle at bottom right,#bfdbfe 0%,transparent 40%),
        linear-gradient(135deg,#eef3f9,#f8fafc);
}

.auth-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:calc(100vh - 120px);
    padding:60px 20px;
}

.auth-card{
    width:100%;
    max-width:700px;
    padding:50px;
    border-radius:28px;
    background:var(--card-bg);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.45);
    box-shadow:
        0 30px 70px rgba(15,23,42,.08),
        0 10px 25px rgba(15,23,42,.05);
    animation:fadeUp .6s ease;
}

.auth-card-head{
    text-align:center;
    margin-bottom:40px;
}

.auth-card-head h1{
    margin:0 0 12px;
    font-size:38px;
    font-weight:800;
    letter-spacing:-1px;
    color:var(--text-main);
}

.auth-lead{
    font-size:15px;
    color:var(--text-muted);
    line-height:1.7;
}

.auth-field{
    display:flex;
    flex-direction:column;
    margin-bottom:24px;
}

.auth-field label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text-main);
}

.auth-field input{
    width:100%;
    padding:16px 18px;
    font-size:15px;
    border:1.5px solid var(--border-color);
    border-radius:14px;
    background:#fff;
    color:var(--text-main);
    outline:none;
    transition:.35s;
}

.auth-field input::placeholder{
    color:#94a3b8;
}

.auth-field input:hover{
    border-color:#93c5fd;
}

.auth-field input:focus{
    border-color:var(--accent-color);
    box-shadow:0 0 0 5px rgba(37,99,235,.12);
    transform:translateY(-2px);
}

.auth-hint{
    margin-top:7px;
    font-size:12px;
    color:var(--text-muted);
}

.auth-form-row-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

.auth-card{
    padding:30px 22px;
    border-radius:22px;
}

.auth-card-head h1{
    font-size:30px;
}

.auth-form-row-2{
    grid-template-columns:1fr;
    gap:0;
}

}
    /* Smooth Input Glow */
    .auth-field input:focus {
      background-color: #ffffff;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .auth-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 400;
    }

    /* Modern Two-column Row Setup */
    .auth-form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* Premium Accent Button */
    .auth-btn {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .auth-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .auth-btn:active {
      transform: translateY(0);
    }

    .auth-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Bottom Redirect Note */
    .auth-note {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .auth-note a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .auth-note a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Responsive/Mobile Optimizations */
    @media (max-width: 768px) {
      .auth-card {
        padding: 30px 24px;
        margin: 10px;
      }
      
      .auth-form-row-2 {
        grid-template-columns: 1fr; /* Stack columns into 1 on mobile */
        gap: 0;
      }
    }
  </style>
</head>
<body class="auth-page auth-page-signup">
  <div id="site-header-mount"></div>
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-card-head">
        <h1>Sign Up</h1>
        <p class="auth-lead">Quick register — saved for faster checkout.</p>
      </div>
      <form id="signupForm">
        <div class="auth-field">
          <label for="su-name">Full Name</label>
          <input id="su-name" type="text" placeholder="Your full name" autocomplete="name">
          <p class="auth-hint">Example: Nusrat Jahan</p>
        </div>
        <div class="auth-form-row-2">
          <div class="auth-field">
            <label for="su-mobile">Mobile</label>
            <input id="su-mobile" type="tel" placeholder="017XXXXXXXX" autocomplete="tel">
            <p class="auth-hint">11-digit Bangladesh mobile</p>
          </div>
          <div class="auth-field">
            <label for="su-email">Email</label>
            <input id="su-email" type="email" placeholder="name@gmail.com" autocomplete="email">
            <p class="auth-hint">Valid email address</p>
          </div>
        </div>
        <div class="auth-form-row-2">
          <div class="auth-field">
            <label for="su-pass">Password</label>
            <input id="su-pass" type="password" placeholder="Create a password" autocomplete="new-password">
            <p class="auth-hint">8+ characters with letters and numbers</p>
          </div>
          <div class="auth-field">
            <label for="su-confirm">Confirm</label>
            <input id="su-confirm" type="password" placeholder="Repeat password" autocomplete="new-password">
            <p class="auth-hint">Must match password</p>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="signupBtn">Create Account</button>
        <p class="auth-note">Already have an account? <a href="signin.html" id="signinLink">Sign In</a></p>
      </form>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script src="cart-utils.js"></script>
  <script src="site-security.js"></script>
  <script src="site-api-config.js?v=20260529"></script>
  <script src="site-api-health.js"></script>
  <script src="auth-config.js"></script>
  <script src="auth-api.js"></script>
  <script defer src="site-header.js?v=20260603logo"></script>
  <script src="site-footer.js?v=20260603footen"></script>
  <script>
    (function () {
      if (typeof showAuthApiNotice === 'function') {
        showAuthApiNotice('.auth-card');
      }
      var form = document.getElementById('signupForm');
      if (!form) return;
      var params = new URLSearchParams(window.location.search);
      var nextUrl = params.get('next') || 'checkout.html';
      var signinLink = document.getElementById('signinLink');
      if (signinLink && params.get('next')) {
        signinLink.href = 'signin.html?next=' + encodeURIComponent(params.get('next'));
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('su-name').value.trim();
        var phone = document.getElementById('su-mobile').value.trim();
        var email = document.getElementById('su-email').value.trim();
        var pass = document.getElementById('su-pass').value;
        var confirm = document.getElementById('su-confirm').value;
        if (name.length < 2) { alert('Please enter your full name.'); return; }
        if (!/^01\d{9}$/.test(phone.replace(/\s+/g, ''))) { alert('Enter a valid 11-digit mobile number.'); return; }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Enter a valid email address.'); return; }
        var strength = MaSecurity.checkPasswordStrength(pass);
        if (!strength.ok) { alert(strength.message); return; }
        if (pass !== confirm) { alert('Passwords do not match.'); return; }
        var btn = document.getElementById('signupBtn');
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        MaAuth.register({ name: name, phone: phone, email: email, password: pass })
          .then(function () {
            window.location.href = nextUrl;
          })
          .catch(function (err) {
            if (typeof isLocalPreview === 'function' && isLocalPreview()) {
              alert(typeof getLocalFileAuthHint === 'function' ? getLocalFileAuthHint() : 'Run the local server and open http://127.0.0.1/signup.html to test sign up.');
              return;
            }
            alert((err && err.message) || 'Registration failed. Please try again.');
          })
          .finally(function () {
            btn.disabled = false;
            btn.textContent = 'Create Account';
          });
      });
    })();
  </script>
</body>
</html>
